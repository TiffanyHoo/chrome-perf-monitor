<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面性能报告</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="toolbar">
    <div class="tb-left">
      <img src="../icons/icon-32.png" alt="" class="logo" />
      <span class="title">页面性能报告</span>
      <span id="targetUrl" class="target-url" title=""></span>
    </div>
    <div class="tb-right">
      <button id="recapture" class="btn">重新采集</button>
      <button id="refresh" class="btn">刷新报告</button>
    </div>
  </header>

  <div id="content" class="content">
    <div id="empty" class="empty">
      <div class="empty-title">暂无性能数据</div>
      <div class="empty-desc">打开或刷新一个网页，加载完成后点「刷新报告」。<br/>报告以当前被检查（inspected）的标签页为维度。</div>
    </div>

    <div id="report" class="report hidden">
      <!-- 总体评级 -->
      <section class="summary card">
        <div class="grade-pill" id="gradePill">
          <span class="grade-dot" id="gradeDot"></span>
          <span id="gradeLabel" class="grade-label">—</span>
        </div>
        <div class="summary-meta">
          <div id="summaryText" class="summary-text">—</div>
          <div class="summary-sub">采集时间 <span id="capTime"></span></div>
        </div>
      </section>

      <!-- 可视化时间轴 -->
      <section class="card">
        <div class="card-title">加载时间轴 <span class="card-hint">各阶段在页面生命周期中的位置与占比（相对导航起点）</span></div>
        <div id="timeline" class="timeline"></div>
        <div class="timeline-axis"><span>0</span><span id="axisEnd"></span></div>
      </section>

      <!-- 阶段明细表 -->
      <section class="card">
        <div class="card-title">阶段明细 <span class="card-hint">所有指标的耗时，0 表示阶段跳过（缓存/连接复用）</span></div>
        <table class="detail-tbl">
          <thead><tr><th>阶段</th><th>指标</th><th>耗时</th><th>等级</th><th>说明</th></tr></thead>
          <tbody id="detailBody"></tbody>
        </table>
      </section>

      <!-- 告警概览 -->
      <section class="card" id="alertsCard">
        <div class="card-title">需要关注的指标 <span class="card-hint">达到“需关注/较差”的指标，按严重程度排序</span></div>
        <div id="alertList" class="alert-list"></div>
      </section>

      <!-- 分阶段明细 -->
      <section class="card">
        <div class="card-title">逐项解读 <span class="card-hint">点开看“是什么 / 为什么慢 / 怎么改”</span></div>
        <div id="groups" class="groups"></div>
      </section>

      <!-- 资源体积排行 -->
      <section class="card" id="resCard">
        <div class="card-title">体积最大的资源 <span class="card-hint">传输体积 Top，优先优化这些</span></div>
        <table class="res-tbl">
          <thead><tr><th>资源</th><th>类型</th><th>传输大小</th><th>耗时</th></tr></thead>
          <tbody id="resBody"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
